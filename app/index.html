      /* =========================================================
       TEMPLATE PICKER
    ========================================================= */

      function closeTemplateMenu() {
        $("templateMenu").classList.remove("open");

        $("templateButton").classList.remove("open");
      }

      function openTemplateMenu() {
        if ($("templateButton").disabled) {
          return;
        }

        $("templateMenu").classList.add("open");

        $("templateButton").classList.add("open");
      }

      function renderTemplates() {
        const menu = $("templateMenu");

        menu.innerHTML = "";

        if (!templates.length) {
          menu.innerHTML = `
          <div
            style="
              padding: 14px;
              color: #667781;
              font-size: 12px;
            "
          >
            No WhatsApp templates found.
          </div>
        `;

          return;
        }

        templates.forEach(function (template) {
          const option = document.createElement("button");

          option.type = "button";

          option.className = "template-option";

          if (
            selectedTemplate &&
            String(selectedTemplate.id) === String(template.id)
          ) {
            option.classList.add("selected");
          }

          if (!template.sid) {
            option.classList.add("disabled");

            option.disabled = true;
          }

          option.dataset.templateId = template.id;

          option.innerHTML = `
            <span class="template-option-name">
              ${escapeHtml(template.name)}
            </span>

            ${
              template.sid
                ? ""
                : `
                  <span class="template-option-meta">
                    Not configured
                  </span>
                `
            }
          `;

          option.addEventListener("click", function (event) {
            event.stopPropagation();

            if (!template.sid) {
              return;
            }

            selectedTemplate = template;

            $("templateButtonText").textContent = template.name;

            $("templateButton").classList.add("has-selection");

            menu.querySelectorAll(".template-option").forEach(function (item) {
              item.classList.remove("selected");
            });

            option.classList.add("selected");

            closeTemplateMenu();

            console.log("WhatsApp template selected:", selectedTemplate);
          });

          menu.appendChild(option);
        });
      }

      /* =========================================================
       LOAD TEMPLATES MODULE
    ========================================================= */

      async function loadTemplates() {
        const menu = $("templateMenu");

        const button = $("templateButton");

        button.disabled = true;

        $("templateButtonText").textContent = "Loading templates...";

        menu.innerHTML = "";

        const allTemplates = [];

        let page = 1;

        while (true) {
          const response = await ZOHO.CRM.API.getAllRecords({
            Entity: CONFIG.TEMPLATE_MODULE,

            page: page,

            per_page: CONFIG.TEMPLATE_PAGE_SIZE,
          });

          const records = Array.isArray(response?.data) ? response.data : [];

          allTemplates.push(...records);

          if (records.length < CONFIG.TEMPLATE_PAGE_SIZE) {
            break;
          }

          page++;
        }

        /*
       * Keep only records that actually have
       * a Template_ID.

       * We don't assume a specific picklist value
       * for "WhatsApp" because the existing Deluge
       * only requires the Template_ID after lookup.
       *
       * If your Templates module later needs
       * explicit channel filtering, we can add it
       * using the exact field/API name.
       */

        templates = allTemplates
          .map(function (record) {
            return {
              id: record.id,

              name: String(
                record.Name || record.Template_Name || "Unnamed Template"
              ).trim(),

              sid: String(record.Template_ID || "").trim(),
            };
          })
          .filter(function (template) {
            return Boolean(template.id);
          });

        console.log("Templates loaded:", templates);

        if (!templates.length) {
          $("templateButtonText").textContent = "No templates available";

          button.disabled = true;

          return;
        }

        /*
         * First configured template becomes
         * the initial selection.
         *
         * We do NOT silently use the old
         * WhatsApp_Template field shared by Leads and Contacts.
         */

        selectedTemplate =
          templates.find(function (template) {
            return Boolean(template.sid);
          }) || null;

        renderTemplates();

        if (selectedTemplate) {
          $("templateButtonText").textContent = selectedTemplate.name;

          button.classList.add("has-selection");

          $("sendButton").disabled = false;
        } else {
          $("templateButtonText").textContent = "No configured templates";

          $("sendButton").disabled = true;
        }

        button.disabled = false;
      }

      /* =========================================================
       TEMPLATE PICKER INITIALIZATION
    ========================================================= */

      function initializeTemplatePicker() {
        $("templateButton").addEventListener("click", function (event) {
          event.stopPropagation();

          const isOpen = $("templateMenu").classList.contains("open");

          if (isOpen) {
            closeTemplateMenu();
          } else {
            openTemplateMenu();
          }
        });

        $("templateMenu").addEventListener("click", function (event) {
          event.stopPropagation();
        });

        document.addEventListener("click", function () {
          closeTemplateMenu();
        });
      }

      /* =========================================================
       GET WHATSAPP SENDER

       Mirrors:

       Sender_Type = WhatsApp
       Finance_Integration = Enabled
    ========================================================= */

      async function getWhatsAppSenderDetails() {
        const criteria =
          "((Sender_Type:equals:WhatsApp) and (Finance_Integration:equals:Enabled))";

        const response = await ZOHO.CRM.API.searchRecord({
          Entity: CONFIG.SENDER_MODULE,

          Type: "criteria",

          Query: criteria,

          page: 1,

          per_page: 10,
        });

        const records = Array.isArray(response?.data) ? response.data : [];

        if (!records.length) {
          throw new Error(
            "WhatsApp integration is disabled. Please enable it to proceed."
          );
        }

        const sender = records[0];

        /*
         * Existing Deluge uses Name
         * as the sender number.
         *
         * Keep the same behavior.
         */

        const fromNumberRaw = String(sender.Name || "").trim();

        const authToken = String(sender.Auth_Token || "").trim();

        const accountSid = String(sender.Account_SID || "").trim();

        if (!fromNumberRaw || !authToken || !accountSid) {
          throw new Error(
            "WhatsApp sender configuration is incomplete. Please check Sender settings."
          );
        }

        return {
          fromNumberRaw,

          authToken,

          accountSid,
        };
      }

      /* =========================================================
       TWILIO SEND

       DIRECT API.
       NO TWILIO CONNECTION.
    ========================================================= */

      async function sendWhatsAppViaTwilio({
        toNumberFormatted,
        fromNumberRaw,
        accountSid,
        authToken,
        templateSid,
        leadName,
      }) {
        const toNumber = "whatsapp:" + toNumberFormatted;

        const fromNumber = "whatsapp:" + fromNumberRaw;

        const authHeader = "Basic " + btoa(accountSid + ":" + authToken);

        const bodyParams = new URLSearchParams();

        bodyParams.set("To", toNumber);

        bodyParams.set("From", fromNumber);

        bodyParams.set("ContentSid", templateSid);

        bodyParams.set(
          "ContentVariables",
          JSON.stringify({
            1: leadName,
          })
        );

        const response = await fetch(
          CONFIG.TWILIO_BASE_URL +
            encodeURIComponent(accountSid) +
            "/Messages.json",
          {
            method: "POST",

            headers: {
              Authorization: authHeader,

              "Content-Type": "application/x-www-form-urlencoded",
            },

            body: bodyParams.toString(),
          }
        );

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (_) {
          data = {
            raw_response: text,
          };
        }

        if (!response.ok) {
          const error = new Error(
            data?.message ||
              data?.raw_response ||
              "Twilio WhatsApp request failed."
          );

          error.twilioResponse = data;

          error.httpStatus = response.status;

          throw error;
        }

        return data;
      }

      /* =========================================================
       RESOLVE WHATSAPP TEMPLATE BODY

       Twilio ContentSid messages can be created without a Body.
       In that case Twilio may return an empty body in the initial
       Messages API response. Fetch the Content API template so the
       conversation UI can immediately display the actual message
       text that was sent.
    ========================================================= */

      async function getWhatsAppTemplateBody({
        templateSid,
        accountSid,
        authToken,
        leadName,
      }) {
        if (!templateSid || !accountSid || !authToken) {
          return "";
        }

        const authHeader = "Basic " + btoa(accountSid + ":" + authToken);

        const response = await fetch(
          "https://content.twilio.com/v1/Content/" +
            encodeURIComponent(templateSid),
          {
            method: "GET",
            headers: {
              Authorization: authHeader,
            },
          }
        );

        if (!response.ok) {
          console.warn(
            "Could not fetch WhatsApp template content:",
            response.status
          );
          return "";
        }

        const content = await response.json();
        const types = content?.types || {};

        /*
         * Content API templates store their rendered text under a
         * content type's "body" property. Prefer a text/quick-reply
         * body, then fall back to any body-bearing content type.
         */
        const preferredTypes = [
          "twilio/text",
          "twilio/quick-reply",
          "whatsapp/text",
          "whatsapp/quick-reply",
        ];

        let body = "";

        for (const typeName of preferredTypes) {
          const typeData = types[typeName];
          if (typeData && typeof typeData.body === "string") {
            body = typeData.body;
            break;
          }
        }

        if (!body) {
          for (const typeName of Object.keys(types)) {
            const typeData = types[typeName];
            if (typeData && typeof typeData.body === "string") {
              body = typeData.body;
              break;
            }
          }
        }

        if (!body) {
          return "";
        }

        /*
         * The current WhatsApp sender uses variable 1 for the CRM
         * Lead/Contact display name, matching the send request.
         */
        return body.replace(/\\{\\{1\\}\\}/g, String(leadName || ""));
      }

      /* =========================================================
       CREATE WHATSAPP HISTORY

       Mirrors the Deluge mapping.
    ========================================================= */

      async function createWhatsAppHistory({
        toNumberFormatted,
        fromNumberRaw,
        sendResponse,
      }) {
        const successful =
          sendResponse && sendResponse.sid && !sendResponse.error_code;

        const historyRecord = {
          To_Number: toNumberFormatted,

          From_Number: fromNumberRaw,

          Message_Direction: "Outbound",

          Message_Type: "Direct Message",
        };

        historyRecord[getCurrentModuleConfig().historyLookupField] =
          currentRecordId;

        if (successful) {
          historyRecord.Name = sendResponse.sid;

          historyRecord.Message = sendResponse.body || "";

          historyRecord.Status = "Sent";

          historyRecord.Message_Logs = "Delivered successfully.";
        } else {
          historyRecord.Name = sendResponse?.sid || "FAILED-" + currentRecordId;

          historyRecord.Message = sendResponse?.body || "";

          historyRecord.Status = "Failed";

          historyRecord.Message_Logs = JSON.stringify(sendResponse || {});
        }

        const response = await ZOHO.CRM.API.insertRecord({
          Entity: CONFIG.HISTORY_MODULE,

          APIData: historyRecord,

          Trigger: [],
        });

        console.log("WhatsApp history created:", response);

        return response;
      }

      /* =========================================================
       OPTIMISTIC WHATSAPP UI MESSAGE

       SMS already adds its outgoing bubble to the local history
       immediately. WhatsApp must do the same. A CRM search made
       immediately after insertRecord() can temporarily return the
       previous history snapshot, so reloading here can remove the
       just-sent message from the widget until CRM is refreshed.
    ========================================================= */

      function addWhatsAppOptimisticMessage({ message, sid, status }) {
        const temporaryMessage = {
          id: "wa_temp_" + Date.now(),
          Name: sid || "",
          Message: String(message || ""),
          Body: String(message || ""),
          Message_Direction: "Outbound",
          Message_Type: "Direct Message",
          Status: status || "Sent",
          Message_Logs: status === "Sent" ? "Delivered successfully." : "",
          Created_Time: new Date().toISOString(),
          _temporary: true,
        };

        whatsappHistory = Array.isArray(whatsappHistory) ? whatsappHistory : [];

        whatsappHistory.push(temporaryMessage);
        renderWhatsAppHistory();

        return temporaryMessage;
      }

      /* =========================================================
       SEND BUTTON STATE
    ========================================================= */

      function setSendButtonState(sending) {
        isSending = sending;

        const button = $("sendButton");

        button.disabled = sending || !selectedTemplate;

        if (sending) {
          button.style.opacity = "0.65";

          button.style.cursor = "wait";
        } else {
          button.style.opacity = "1";

          button.style.cursor = "pointer";
        }
      }

      /* =========================================================
       TEMPORARY UI MESSAGE
    ========================================================= */

      function showTemporaryError(message) {
        const button = $("templateButton");

        const text = $("templateButtonText");

        const original = text.textContent;

        text.textContent = message;

        button.style.color = "#d32f2f";

        setTimeout(function () {
          text.textContent = selectedTemplate
            ? selectedTemplate.name
            : original || "Select template";

          button.style.color = selectedTemplate ? "#111b21" : "#667781";
        }, 2500);
      }

      /* =========================================================
       SEND WHATSAPP MESSAGE
    ========================================================= */

      async function sendWhatsAppMessage() {
        if (isSending) {
          return;
        }

        if (!currentRecordId || !currentRecordData) {
          showTemporaryError("CRM record is not loaded");

          return;
        }

        if (!selectedTemplate) {
          showTemporaryError("Select a template first");

          return;
        }

        if (!selectedTemplate.sid) {
          showTemporaryError("Template is not configured");

          return;
        }

        setSendButtonState(true);

        closeTemplateMenu();

        let toNumberFormatted = "";

        let fromNumberRaw = "";

        let senderDetails = null;

        let sendResponse = null;

        try {
          /* ---------------------------------------------------
           1. Validate mobile
        --------------------------------------------------- */

          toNumberFormatted = normalizeMobile(currentRecordData.Mobile);

          /* ---------------------------------------------------
           2. Get WhatsApp Sender
        --------------------------------------------------- */

          senderDetails = await getWhatsAppSenderDetails();

          fromNumberRaw = senderDetails.fromNumberRaw;

          /* ---------------------------------------------------
           3. Lead name
        --------------------------------------------------- */

          const leadName = getCurrentRecordDisplayName();

          /* ---------------------------------------------------
           4. Send through Twilio
        --------------------------------------------------- */

          sendResponse = await sendWhatsAppViaTwilio({
            toNumberFormatted,

            fromNumberRaw,

            accountSid: senderDetails.accountSid,

            authToken: senderDetails.authToken,

            templateSid: selectedTemplate.sid,

            leadName,
          });

          /*
           * ContentSid messages may have an empty `body` in the
           * initial Messages API response. Resolve the actual
           * template text before creating WhatsApp_History so the
           * message bubble appears immediately, without requiring
           * a widget refresh or waiting for a later webhook update.
           */
          if (sendResponse?.sid && !String(sendResponse.body || "").trim()) {
            const resolvedBody = await getWhatsAppTemplateBody({
              templateSid: selectedTemplate.sid,
              accountSid: senderDetails.accountSid,
              authToken: senderDetails.authToken,
              leadName,
            });

            if (resolvedBody) {
              sendResponse.body = resolvedBody;
            }
          }

          /* ---------------------------------------------------
           5. Show the outgoing bubble immediately

           Do NOT reload WhatsApp history here. Zoho CRM can return
           the previous search result for a short time immediately
           after insertRecord(), which would overwrite the local
           history array and make the newly sent message disappear.
        --------------------------------------------------- */

          const optimisticMessage = addWhatsAppOptimisticMessage({
            message: sendResponse.body || "",
            sid: sendResponse.sid,
            status: "Sent",
          });

          /* ---------------------------------------------------
           6. Persist SUCCESS history in CRM

           The widget keeps the optimistic bubble visible. When the
           widget is reopened, loadWhatsAppHistory() replaces the
           local state with the persisted CRM history.
        --------------------------------------------------- */

          try {
            await createWhatsAppHistory({
              toNumberFormatted,

              fromNumberRaw,

              sendResponse,
            });
          } catch (historyError) {
            console.error(
              "WhatsApp message sent, but CRM history creation failed:",
              historyError
            );

            optimisticMessage.Message_Logs = getErrorMessage(historyError);
          }

          console.log("WhatsApp message sent successfully.");
        } catch (error) {
          console.error("WhatsApp send failed:", error);

          /*
           * If Twilio returned an error response,
           * preserve it in WhatsApp History.
           *
           * Do not create a failure history record
           * for validation failures where Twilio was
           * never attempted.
           */

          if (error?.twilioResponse && toNumberFormatted && fromNumberRaw) {
            try {
              const failureResponse = error.twilioResponse;

              addWhatsAppOptimisticMessage({
                message:
                  failureResponse?.body || "WhatsApp message failed to send.",
                sid: failureResponse?.sid || "",
                status: "Failed",
              });

              await createWhatsAppHistory({
                toNumberFormatted,

                fromNumberRaw,

                sendResponse: failureResponse,
              });
            } catch (historyError) {
              console.error(
                "Failed to create WhatsApp failure history:",
                historyError
              );
            }
          }

          showTemporaryError(
            error?.message || "Error occurred while sending WhatsApp message."
          );
        } finally {
          setSendButtonState(false);
        }
      }
      /* =========================================================
       COMMUNICATION CHANNEL SWITCHING
    ========================================================= */

      let activeChannel = "whatsapp";

      function switchCommunicationChannel(channel) {
        const whatsappTab = $("whatsappTab");
        const smsTab = $("smsTab");
        const whatsappComposer = document.querySelector(".composer");
        const smsComposer = $("smsComposer");

        if (!whatsappTab || !smsTab || !whatsappComposer || !smsComposer) {
          return;
        }

        activeChannel = channel;

        if (channel === "sms") {
          whatsappTab.classList.remove("active");
          whatsappTab.setAttribute("aria-selected", "false");

          smsTab.classList.add("active");
          smsTab.setAttribute("aria-selected", "true");

          whatsappComposer.style.display = "none";

          smsComposer.classList.add("active");

          showChatState("Loading SMS history", "Fetching SMS conversation...");

          loadSMSHistory()
            .then(function () {
              renderSMSHistory();
            })
            .catch(function (error) {
              console.error("Failed to load SMS history:", error);

              showChatState(
                "Unable to load SMS history",
                getErrorMessage(error)
              );

              showSMSError(
                "Unable to load SMS history: " + getErrorMessage(error)
              );
            });

          return;
        }

        smsTab.classList.remove("active");
        smsTab.setAttribute("aria-selected", "false");

        whatsappTab.classList.add("active");
        whatsappTab.setAttribute("aria-selected", "true");

        smsComposer.classList.remove("active");

        whatsappComposer.style.display = "flex";

        renderWhatsAppHistory();
      }

      function initializeChannelTabs() {
        $("whatsappTab").addEventListener("click", function () {
          switchCommunicationChannel("whatsapp");
        });

        $("smsTab").addEventListener("click", function () {
          switchCommunicationChannel("sms");
        });
      }

      /* =========================================================
       TOAST
    ========================================================= */

      function getErrorMessage(error) {
        if (!error) {
          return "Unknown error.";
        }

        if (typeof error === "string") {
          return error;
        }

        if (error.message) {
          return String(error.message);
        }

        if (error.response?.message) {
          return String(error.response.message);
        }

        if (error.data?.message) {
          return String(error.data.message);
        }

        try {
          return JSON.stringify(error);
        } catch (_) {
          return String(error);
        }
      }

      function showToast(message, type) {
        const toastType =
          type === "error" || type === "success" || type === "info"
            ? type
            : "info";

        let container = document.getElementById("toastContainer");

        if (!container) {
          container = document.createElement("div");

          container.id = "toastContainer";

          container.className = "toast-container";

          document.body.appendChild(container);
        }

        const toast = document.createElement("div");

        toast.className = "toast " + toastType;

        toast.textContent = String(message || "");

        container.appendChild(toast);

        requestAnimationFrame(function () {
          toast.classList.add("show");
        });

        setTimeout(function () {
          toast.classList.remove("show");

          setTimeout(function () {
            toast.remove();

            if (!container.children.length) {
              container.remove();
            }
          }, 180);
        }, 4500);
      }

      /* =========================================================
       SMS ERROR UI
    ========================================================= */

      function showSMSError(message) {
        const errorMessage = String(message || "Unable to send SMS.").trim();

        console.error("[SMS ERROR]", errorMessage);

        showToast(errorMessage, "error");
      }

      /* =========================================================
       SMS CHARACTER COUNTER
    ========================================================= */

      function initializeSMSComposer() {
        const input = $("smsInput");

        const counter = $("smsCharacterCount");

        if (!input) {
          return;
        }

        input.addEventListener("input", function () {
          if (counter) {
            counter.textContent = String(input.value.length);
          }
        });

        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();

            if (!isSMSSending) {
              sendSMSMessage();
            }
          }
        });
      }

      /* =========================================================
       SEND BUTTON INITIALIZATION
    ========================================================= */

      function initializeSendButton() {
        $("sendButton").addEventListener("click", sendWhatsAppMessage);

        $("smsSendButton").addEventListener("click", sendSMSMessage);
      }

      /* =========================================================
       SMS SEND BUTTON STATE
    ========================================================= */

      function setSMSSendButtonState(sending) {
        isSMSSending = sending;

        const button = $("smsSendButton");

        if (!button) {
          return;
        }

        button.disabled = sending;

        button.style.opacity = sending ? "0.65" : "1";

        button.style.cursor = sending ? "wait" : "pointer";
      }

      /* =========================================================
       CREATE SMS HISTORY
    ========================================================= */

      async function createSMSHistory(historyData) {
        const moduleConfig = getCurrentModuleConfig();

        const APIData = {
          To_Number: historyData.to,
          From_Number: historyData.from,
          Message_Direction: historyData.direction || "Outbound",
          Message_Type: "Direct SMS",
          Name: historyData.message || "",
          Message_SID: historyData.sid || "",
          Status: historyData.status || "Failed",
          Message_Logs: historyData.logs || "",
        };

        APIData[moduleConfig.historyLookupField] = currentRecordId;

        console.log("[SMS] Creating SMS_History:", {
          module: currentModule,
          lookupField: moduleConfig.historyLookupField,
          data: APIData,
        });

        const response = await ZOHO.CRM.API.insertRecord({
          Entity: CONFIG.SMS_HISTORY_MODULE,
          APIData: APIData,
          Trigger: [],
        });

        console.log("[SMS] SMS_History created:", response);

        if (response?.data?.[0]?.code && response.data[0].code !== "SUCCESS") {
          throw new Error(
            response.data[0].message ||
              response.data[0].details ||
              "CRM rejected SMS_History."
          );
        }

        return response;
      }

      /* =========================================================
       SEND SMS
    ========================================================= */

      async function sendSMSMessage() {
        if (isSMSSending) {
          return;
        }

        const input = $("smsInput");

        let temporarySMSId = null;

        let toNumber = "";
        let fromNumber = "";

        setSMSSendButtonState(true);

        try {
          if (!currentRecordId) {
            throw new Error("Record ID is missing.");
          }

          if (!currentRecordData) {
            throw new Error("CRM record data is not loaded.");
          }

          const smsContent = String(input?.value || "").trim();

          if (!smsContent) {
            throw new Error(
              "Message content is empty. Please enter a message."
            );
          }

          /*
           * Add the outgoing bubble immediately.
           */
          temporarySMSId = "sms_temp_" + Date.now();

          smsHistory = Array.isArray(smsHistory) ? smsHistory : [];

          smsHistory.push({
            id: temporarySMSId,
            Name: smsContent,
            Message: smsContent,
            Body: smsContent,
            Message_Direction: "Outbound",
            Message_Type: "Direct SMS",
            Status: "Sending",
            Message_Logs: "",
            _temporary: true,
            _timestamp: new Date().toISOString(),
          });

          renderSMSHistory();

          /*
           * Mobile normalization.
           */
          const rawMobile = String(currentRecordData.Mobile || "").trim();

          if (!rawMobile) {
            throw new Error("Mobile number is missing. SMS will not be sent.");
          }

          let mobileNorm = rawMobile.replace(/[^0-9]/g, "");

          /*
           * India +91
           */
          if (
            (mobileNorm.length === 10 &&
              (mobileNorm.startsWith("9") ||
                mobileNorm.startsWith("8") ||
                mobileNorm.startsWith("7"))) ||
            (mobileNorm.length === 11 && mobileNorm.startsWith("0"))
          ) {
            if (mobileNorm.length === 11) {
              mobileNorm = mobileNorm.substring(1);
            }

            toNumber = "+91" + mobileNorm;
          } else if (
            /*
             * Australia +61
             */
            (mobileNorm.length === 9 && mobileNorm.startsWith("4")) ||
            (mobileNorm.length === 10 && mobileNorm.startsWith("04"))
          ) {
            if (mobileNorm.length === 10) {
              mobileNorm = mobileNorm.substring(1);
            }

            toNumber = "+61" + mobileNorm;
          } else {
            /*
             * Existing fallback.
             */
            if (rawMobile.startsWith("+")) {
              toNumber = rawMobile;
            } else {
              toNumber = "+" + mobileNorm;
            }
          }

          if (!toNumber.trim()) {
            throw new Error("Invalid mobile number format. Please recheck.");
          }

          /*
           * SMS Sender.
           */
          const criteria =
            "((Sender_Type:equals:SMS) and (Finance_Integration:equals:Enabled))";

          const senderResponse = await ZOHO.CRM.API.searchRecord({
            Entity: CONFIG.SENDER_MODULE,
            Type: "criteria",
            Query: criteria,
            page: 1,
            per_page: 10,
          });

          const senderRows = Array.isArray(senderResponse?.data)
            ? senderResponse.data
            : [];

          if (!senderRows.length) {
            throw new Error(
              "SMS integration is disabled. Please enable SMS to proceed."
            );
          }

          const senderInfo = senderRows[0];

          fromNumber = String(senderInfo?.Name || "").trim();

          const authToken = String(senderInfo?.Auth_Token || "").trim();

          const accountSid = String(senderInfo?.Account_SID || "").trim();

          if (!fromNumber || !authToken || !accountSid) {
            throw new Error(
              "SMS sender configuration is incomplete. Please check Sender settings."
            );
          }

          /*
           * Direct Twilio request.
           */
          const authHeader = "Basic " + btoa(accountSid + ":" + authToken);

          const twilioURL =
            CONFIG.TWILIO_BASE_URL +
            encodeURIComponent(accountSid) +
            "/Messages.json";

          const bodyParams = new URLSearchParams();

          bodyParams.append("To", toNumber);

          bodyParams.append("From", fromNumber);

          bodyParams.append("Body", smsContent);

          const twilioResponse = await fetch(twilioURL, {
            method: "POST",
            headers: {
              Authorization: authHeader,
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: bodyParams.toString(),
          });

          const responseText = await twilioResponse.text();

          let responseData;

          try {
            responseData = JSON.parse(responseText);
          } catch (_) {
            responseData = {
              raw_response: responseText,
            };
          }

          const twilioSid =
            responseData && typeof responseData === "object"
              ? responseData.sid
              : null;

          const twilioErrorCode =
            responseData && typeof responseData === "object"
              ? responseData.error_code
              : null;

          const twilioSucceeded = Boolean(
            twilioResponse.ok && twilioSid && !twilioErrorCode
          );

          let historyStatus = twilioSucceeded ? "Sent" : "Failed";

          let historyLogs = twilioSucceeded
            ? "Delivered successfully."
            : typeof responseData === "object"
            ? JSON.stringify(responseData)
            : String(responseText || "Twilio request failed.");

          /*
           * Update the outgoing bubble.
           */
          const temporaryMessage = smsHistory.find(function (item) {
            return item.id === temporarySMSId;
          });

          if (temporaryMessage) {
            temporaryMessage.Status = historyStatus;

            temporaryMessage.Message_SID = twilioSid ? String(twilioSid) : "";

            temporaryMessage.Message_Logs = historyLogs;

            temporaryMessage._sending = false;
          }

          renderSMSHistory();

          /*
           * Always persist the result,
           * exactly as the Deluge does:
           * successful or failed Twilio response.
           */
          try {
            await createSMSHistory({
              to: toNumber,
              from: fromNumber,
              message: smsContent,
              sid: twilioSid ? String(twilioSid) : "",
              status: historyStatus,
              logs: historyLogs,
              direction: "Outbound",
            });
          } catch (historyError) {
            /*
             * Twilio may already have succeeded.
             * Keep the bubble status truthful and
             * show the CRM problem separately.
             */
            showSMSError(getErrorMessage(historyError));

            /*
             * Do not pretend the SMS itself failed.
             */
            if (twilioSucceeded) {
              if (input) {
                input.value = "";
              }

              const counter = $("smsCharacterCount");

              if (counter) {
                counter.textContent = "0";
              }

              return;
            }

            throw historyError;
          }

          if (!twilioSucceeded) {
            let userMessage = "SMS failed to send.";

            if (responseData && typeof responseData === "object") {
              if (responseData.message) {
                userMessage += " " + responseData.message;
              }

              if (responseData.code) {
                userMessage += " (Code: " + responseData.code + ")";
              }

              if (responseData.error_code) {
                userMessage += " (Error code: " + responseData.error_code + ")";
              }
            } else if (responseText) {
              userMessage += " " + responseText;
            }

            throw new Error(userMessage);
          }

          /*
           * Success.
           */
          if (input) {
            input.value = "";
          }

          const counter = $("smsCharacterCount");

          if (counter) {
            counter.textContent = "0";
          }

          /*
           * Keep the successful outgoing
           * bubble in the UI. When the widget
           * is reopened, loadSMSHistory()
           * replaces it with CRM history.
           */
          renderSMSHistory();

          showToast("SMS sent successfully.", "success");
        } catch (error) {
          console.error("[SMS] Final error:", error);

          const errorMessage = getErrorMessage(error);

          /*
           * Mark the optimistic bubble
           * as failed when the failure happened
           * before the Twilio result was persisted.
           */
          if (temporarySMSId) {
            const temporaryMessage = smsHistory.find(function (item) {
              return item.id === temporarySMSId;
            });

            if (temporaryMessage && temporaryMessage.Status === "Sending") {
              temporaryMessage.Status = "Failed";

              temporaryMessage._sending = false;

              temporaryMessage.Message_Logs = errorMessage;

              renderSMSHistory();
            }
          }

          showSMSError(errorMessage);
        } finally {
          setSMSSendButtonState(false);
        }
      }

      /* =========================================================
       ZOHO EMBEDDED APP INITIALIZATION
    ========================================================= */

      function initializeZohoWidget() {
        if (typeof ZOHO === "undefined" || !ZOHO.embeddedApp) {
          console.error("Zoho Embedded App SDK is not available.");

          $("contactName").textContent = "Unable to load";

          $("contactStatus").textContent = "Zoho CRM SDK unavailable";

          showChatState(
            "Unable to load conversation",
            "The Zoho CRM SDK is unavailable."
          );

          return;
        }

        ZOHO.embeddedApp.on("PageLoad", async function (data) {
          console.log("Zoho CRM PageLoad:", data);

          const entity = data?.Entity || data?.EntityName;

          const recordId = Array.isArray(data?.EntityId)
            ? data.EntityId[0]
            : data?.EntityId;

          try {
            /*
             * 1. Detect the current CRM module and load the record
             */

            await loadCurrentRecord(entity, recordId);

            /*
             * 2. Load existing history
             */

            await loadWhatsAppHistory();

            /*
             * 3. Load real Templates
             */

            await loadTemplates();
          } catch (error) {
            console.error("Unable to initialize WhatsApp widget:", error);

            $("contactName").textContent = "Unable to load";

            $("contactStatus").textContent =
              error?.message || "Please refresh and try again.";

            showChatState(
              "Unable to load conversation",
              error?.message || "An unexpected error occurred."
            );
          }
        });

        ZOHO.embeddedApp.init();
      }

      /* =========================================================
       START
    ========================================================= */

      window.addEventListener("load", function () {
        initializeChannelTabs();

        initializeTemplatePicker();

        initializeSendButton();

        initializeSMSComposer();

        initializeZohoWidget();
      });
    </script>
